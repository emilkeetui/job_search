google:
  # spreadsheet_id and calendar_id live in .env, not here -- this repo is public.
  # Copy .env.example to .env and fill in JOEPIPE_SPREADSHEET_ID / JOEPIPE_CALENDAR_ID.
  spreadsheet_id: ""                 # REQUIRED via .env -- see JOEPIPE_SPREADSHEET_ID
  worksheet_name: "Sheet1"           # the user's existing hand-maintained job tracker tab
  calendar_id: ""                    # REQUIRED via .env -- see JOEPIPE_CALENDAR_ID
                                     # dedicated "JOE Deadlines" secondary calendar,
                                     # ...@group.calendar.google.com -- "primary" is refused

fetch:
  include_previous_issue: true
  cache_dir: "data/raw"

scoring:
  min_score_to_sheet: 18      # below this, drop entirely
  min_score_to_calendar: 20   # at/above this, auto-create a deadline event
  sections:                   # points by JOE section
    "Full-Time Nonacademic": 5
    "Other Nonacademic (Temporary, Part-Time, Non-Salaried, Consulting, Etc.)": 2
    "US: Full-Time Academic (Permanent, Tenure Track or Tenured)": 3
    "International: Full-Time Academic (Permanent, Tenure Track or Tenured)": 0
    "US: Other Academic (Visiting or Temporary)": 2
    "US: Other Academic (Part-time or Adjunct)": 2
  # Temporary/visiting doesn't matter if the appointment is full-time for >= min_months
  # (e.g. "24-month appointment", "two-year postdoc"): score it like the permanent
  # equivalent. Anything stating "part-time" keeps its section weight above.
  long_term_temporary:
    min_months: 12
    sections:
      "US: Other Academic (Visiting or Temporary)": 3                                    # = US full-time academic
      "Other Nonacademic (Temporary, Part-Time, Non-Salaried, Consulting, Etc.)": 5      # = full-time nonacademic
  # Used ONLY when a listing has no JEL codes (JOE's "00 - Default: Any Field"): each code
  # whose phrases appear in the description is treated as if the poster had tagged it,
  # and fires fields below through their `jel` lists (shown as "jel~Q3" in reasons).
  # Only codes some field actually uses are worth listing here.
  jel_inference:
    # Avoid generic words that show up in boilerplate ("employment" in EEO statements,
    # "programming" as in seminar programming, "resource economics" in degree lists).
    Q2: ["renewable resource", "water resource", "fisheries", "forestry", "land use",
         "conservation"]
    Q3: ["critical mineral", "mineral", "mining", "nonrenewable", "extractive", "oil and gas"]
    Q4: ["energy policy", "energy economics", "energy market", "electricity", "renewable energy",
         "energy transition", "decarboniz"]
    Q5: ["environmental economics", "environmental policy", "climate", "pollution", "emissions",
         "air quality", "water quality"]
    I1: ["health economics", "health policy", "healthcare", "health care", "public health",
         "health insurance"]
    I3: ["poverty", "inequality", "social welfare"]
    D6: ["welfare economics", "distributional"]
    D8: ["information economics", "behavioral economics", "mechanism design"]
    J2: ["labor economics", "labor market", "labor supply"]
    H2: ["public finance", "taxation", "tax policy"]
    L1: ["industrial organization", "market structure"]
    L4: ["antitrust", "competition policy", "merger"]
    L5: ["industrial policy", "regulatory economics"]
    R2: ["urban economics", "housing"]
    O1: ["development economics", "developing countries", "economic development"]
    C1: ["econometrics", "causal inference"]
    C5: ["econometric model", "structural estimation", "forecasting"]
    C8: ["data management", "data engineering", "python", "stata"]
    D72: ["political economy", "elections", "voting", "legislat"]
  target_employers:           # substring match on institution, case-insensitive
    points: 6
    names: ["Analysis Group", "Cornerstone Research", "Brattle", "Charles River Associates",
            "CRA International", "Compass Lexecon", "NERA", "Edgeworth Economics",
            "Bates White", "Keystone Strategy", "Berkeley Research Group",
            "Resources for the Future", "Mathematica", "Abt", "RAND", "Urban Institute",
            "NBER", "World Bank"]
  # Hard exclusion: any listing whose institution matches one of these is never written
  # to the sheet or calendar, regardless of score (and any existing joepipe calendar
  # event for it is deleted). No federal government jobs, incl. the Fed and the CEA.
  exclude_employers: ["Federal Reserve", "Council of Economic Advisers",
                      "Council of Economic Advisors", "White House",
                      "Office of Management and Budget", "Congressional Budget Office",
                      "Government Accountability Office", "Joint Committee on Taxation",
                      "Medicare Payment Advisory Commission", "MedPAC",
                      "Office of Evaluation Sciences", "U.S. Department of",
                      "US Department of", "United States Department of",
                      "Department of the Treasury", "U.S. Treasury", "Census Bureau",
                      "Bureau of Labor Statistics", "Bureau of Economic Analysis",
                      "Economic Research Service", "Energy Information Administration",
                      "Federal Communications Commission", "Federal Trade Commission",
                      "Federal Energy Regulatory Commission", "Federal Deposit Insurance",
                      "FDIC", "Federal Housing Finance Agency", "U.S. Securities",
                      "Securities and Exchange Commission", "Commodity Futures Trading",
                      "Consumer Financial Protection Bureau", "Comptroller of the Currency",
                      "Equal Employment Opportunity Commission",
                      "Environmental Protection Agency", "International Trade Commission",
                      "Social Security Administration", "National Institutes of Health",
                      "Food and Drug Administration", "Small Business Administration"]
  # The user's five target areas. A field fires if ANY of its JEL prefixes or keywords
  # match; it scores `points`, +1 for each additional distinct signal, capped at points+3.
  # The names of the fields that fired go in the sheet's `Fields` column so the sheet can
  # be filtered by area.
  fields:
    environmental:
      points: 5
      jel: ["Q5", "Q4", "Q2", "Q3"]     # env econ, energy, renewables/water, nonrenewables, minerals/mining
      keywords: ["environmental economics", "energy economics", "climate", "water quality",
                 "drinking water", "air quality", "pollution", "coal", "mining", "emissions",
                 "electricity market", "utility regulation", "natural resource",
                 "environmental justice", "EPA", "sustainability", "critical minerals",
                 "rare earth", "mineral", "extractive industries", "natural resource management"]
    health:
      points: 4
      jel: ["I1", "I3"]
      keywords: ["health economics", "health policy", "healthcare", "public health",
                 "medicaid", "medicare", "insurance", "pharmaceutical", "hospital",
                 "epidemiolog", "mortality", "health outcomes"]
    micro:
      points: 4
      jel: ["D1", "D6", "D8", "J2", "J3", "H2", "L1", "L4", "R2", "O1"]
      keywords: ["applied microeconomics", "labor economics", "public economics",
                 "industrial organization", "development economics", "urban economics",
                 "causal inference", "quasi-experimental", "difference-in-differences",
                 "instrumental variables", "regression discontinuity", "program evaluation",
                 "policy evaluation", "welfare analysis"]
    data_science:
      points: 4
      jel: ["C1", "C3", "C4", "C5", "C8", "C9"]
      keywords: ["data scientist", "data science", "machine learning", "econometrician",
                 "statistical modeling", "predictive model", "python", "R", "SQL",
                 "experimentation", "a/b test", "causal machine learning", "big data",
                 "quantitative researcher", "quantitative analyst"]
    consulting:
      points: 5
      jel: ["K2", "K4", "L4", "L5"]
      keywords: ["economic consulting", "litigation", "expert testimony", "antitrust",
                 "competition policy", "damages", "class certification", "merger review",
                 "regulatory analysis", "benefit-cost", "cost-benefit", "valuation",
                 "client engagement", "case team"]
    political_economy:
      points: 4
      jel: ["P16", "D72", "P48"]
      keywords: ["political economy", "political economics", "public choice",
                 "institutions and development", "comparative political economy",
                 "political institutions"]
    teaching:
      points: 3
      jel: []
      keywords: ["teaching-track", "teaching professor", "senior lecturer",
                 "principal lecturer", "lecturer", "adjunct professor",
                 "teaching load", "course development", "teaching-focused",
                 "instructor of economics"]
  # Field keywords of 5+ letters normally match anywhere, even mid-word (so "valuation"
  # also catches "evaluation" -- intended). These only match at the start of a word.
  word_start_keywords: ["mining"]   # not "determining"/"examining"
  max_field_points: 20        # total cap across all fields
  negative:                   # subtract points
    - {points: -4, patterns: ["macroeconomics", "monetary policy", "asset pricing",
                              "corporate finance", "marketing", "accounting",
                              "economic history", "history of thought"]}
  locations:
    preferred: {points: 2, patterns: ["New York", "Boston", "Washington", "Massachusetts",
                                      "District of Columbia", "Chicago", "Illinois", "Remote"]}
    penalize:  {points: -2, patterns: []}   # non-US handled via section weights

calendar:
  reminder_days: [14, 3]      # popup reminders before the all-day deadline event
  event_prefix: "[JOE]"
